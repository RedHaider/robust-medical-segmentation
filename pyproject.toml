[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robust-medseg-lite"
version = "0.1.0"
description = "Frequency-aware lightweight segmentation robustness benchmark"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pillow>=10", "scikit-learn>=1.4"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
robust-medseg = "robust_medseg.experiment:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
